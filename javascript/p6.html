<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
    <input type="text" placeholder="add to do">
    <button onclick="addtodo()">add</button>
    <button onclick="lastdel()">lastdel</button>
    <button onclick="firstdel()">firstdel</button>
    <div id="todo-container"></div>
    </div>





    <script>
        let todos=[];
        function addtodo(){
            todos.push({"title":document.querySelector("input").value});
            render();
        }
        function lastdel(){
            todos.splice(todos.length-1 , 1);
            render();
        }
        function firstdel(){
            todos.splice(0,1);
            render();
        }
        let ctr=0;
        function addtodocomponent(todo){
            let nelem=document.createElement("div");
            let inele=document.createElement("div");
            let buttele=document.createElement("button");
            buttele.innerHTML="Delete";
            buttele.setAttribute("id",ctr);
            buttele.onclick=function(){
                // let id=this.getAttribute("id");
                // todos.splice(id,1);
                // render();
                // let element=document.getElementById(("id"));
                // if(element){
                //     element.parentNode.removeChild(element);
                // }
                

            }
            inele.innerHTML=todo.title;
            nelem.appendChild(inele);
            nelem.appendChild(buttele);
            return nelem;
            ctr++;

        }

        function render(){
            document.querySelector("#todo-container").innerHTML="";
            for(let i=0;i<todos.length;i++){
                let element=addtodocomponent(todos[i],i);
                document.querySelector("#todo-container").appendChild(element);
            }

        }
    </script>


</body>
</html>
