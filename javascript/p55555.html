<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black; color: beige;">
    <div style="display: flex;">
    <input type="text" placeholder="add todo">
    <button onclick="addtodo()">ADD</button>
    </div>

<script>
    function deletetodo(index){
        let element=document.getElementById("todo-"+index);
        element.parentNode.removeChild(element);
    }

    let ctr=1;
    function addtodo(){

        let element1=document.createElement("div");
        element1.setAttribute("id","todo-"+ctr);
        element1.setAttribute("style","display:flex");
        let value1=document.querySelector("input").value;
        element1.innerHTML=("<div>"+ctr+'. '+value1+'</div><button onclick="deletetodo('+ctr+')">delete</button>');
        document.querySelector("body").appendChild(element1);
        ctr+=1;

    }

</script>


</body>
</html>
