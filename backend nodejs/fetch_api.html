<!-- we have something synattically better than fetch i.e. axios and it is like the auxillary as we say that async await is synatic sugar for promises as under the hood they are promises only. -->

<html>
    <head>
        <script src="https://unpkg.com/axios@1.10.0/dist/axios.min.js"></script>
    </head>

    <body>
        <div id="post1">

        </div>

        <script>
            async function getposts(){
                const response=await axios.get("http://localhost:3000/ride1?age=40");
                document.getElementById("post1").innerHTML=response.data.msg;
            }
            getposts();
        </script>
    </body>
</html>
